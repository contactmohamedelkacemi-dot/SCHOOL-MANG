{% extends 'base_auth.html' %}

{% block title %}Password Reset Complete - School Management{% endblock %}

{% block content %}
<div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="max-width: 500px; width: 100%;">
    <div class="card-body p-5 text-center">
        <div class="mb-4">
            <div class="bg-success bg-opacity-10 rounded-circle d-inline-flex justify-content-center align-items-center mb-3" style="width: 80px; height: 80px;">
                <i class="bi bi-check-lg text-success display-4"></i>
            </div>
            <h3 class="fw-bold">Password Reset Complete</h3>
            <p class="text-muted mt-3">
                Your password has been successfully set. You may go ahead and log in now with your new password.
            </p>
        </div>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary rounded-pill px-4 btn-lg w-100 shadow-sm">Log in</a>
    </div>
</div>
{% endblock %}
