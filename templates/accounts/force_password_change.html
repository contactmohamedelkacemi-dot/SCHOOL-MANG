{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Update Password - School Management{% endblock %}

{% block content %}
<div class="row justify-content-center fade-in mt-5">
    <div class="col-md-6">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-danger"><i class="bi bi-shield-lock-fill me-2"></i>Security Required</h2>
            <p class="text-muted fs-5">For security reasons, you must change your password before continuing.</p>
        </div>

        <div class="card shadow border-0">
            <div class="card-body p-4 p-md-5">
                <form method="post">
                    {% csrf_token %}
                    
                    {{ form|crispy }}

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-danger btn-lg shadow-sm">
                            <i class="bi bi-key-fill me-2"></i> Update Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
