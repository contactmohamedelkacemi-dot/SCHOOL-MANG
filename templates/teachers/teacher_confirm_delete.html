{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Confirm Delete</h5>
            </div>
            <div class="card-body text-center py-5">
                <i class="bi bi-exclamation-triangle text-danger display-1 mb-3"></i>
                <h4 class="mb-3">Are you sure?</h4>
                <p class="text-muted">Do you really want to delete the teacher <strong>{{ teacher.full_name }}</strong>? This will also delete their user account and all associated records. This process cannot be undone.</p>
                
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <a href="{% url 'teachers:list' %}" class="btn btn-light me-2">Cancel</a>
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
