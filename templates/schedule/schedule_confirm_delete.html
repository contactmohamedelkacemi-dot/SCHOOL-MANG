{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Confirm Delete</h5>
            </div>
            <div class="card-body text-center py-5">
                <i class="bi bi-exclamation-triangle text-danger display-1 mb-3"></i>
                <h4 class="mb-3">Are you sure?</h4>
                <p class="text-muted">Do you want to delete the schedule slot for <strong>{{ schedule.module.name }}</strong> on <strong>{{ schedule.day }} at {{ schedule.time|time:"H:i" }}</strong>?</p>
                
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <a href="{% url 'schedule:group_schedule_view' schedule.group.id %}" class="btn btn-light me-2">Cancel</a>
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
