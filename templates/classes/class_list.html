{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Classes</h2>
    <a href="{% url 'classes:create' %}" class="btn btn-primary"><i class="bi bi-plus-lg me-2"></i>Add Class</a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Class Name</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for cls in classes %}
                    <tr>
                        <td><strong>{{ cls.name }}</strong></td>
                        <td class="text-end">
                            <!-- Update/Delete actions could be added here if needed -->
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="2" class="text-center py-4 text-muted">No classes found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
