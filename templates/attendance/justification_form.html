{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Add Justification</h2>
            <a href="{% url 'attendance:justification_list' %}" class="btn btn-light"><i class="bi bi-arrow-left me-1"></i>Back to List</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}
                        <div class="form-text">{{ field.help_text }}</div>
                        {% endif %}
                        {% if field.errors %}
                        <div class="invalid-feedback d-block">
                            {{ field.errors|join:", " }}
                        </div>
                        {% endif %}
                    </div>
                    {% endfor %}

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Submit Justification</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
