{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Take Attendance</h2>
</div>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    {% for group in groups %}
    <div class="col">
        <div class="card h-100 shadow-sm border-0 group-card hover-effect">
            <div class="card-body text-center p-4">
                <div class="icon-circle bg-primary bg-opacity-10 text-primary mx-auto mb-3">
                    <i class="bi bi-people-fill fs-2"></i>
                </div>
                <h4 class="card-title fw-bold mb-1">{{ group.name }}</h4>
                <p class="text-muted mb-3">{{ group.class_assigned.name }}</p>
                <div class="d-flex justify-content-between text-muted small mb-4">
                    <span><i class="bi bi-person me-1"></i>{{ group.students.count }} Students</span>
                </div>
                <a href="{% url 'attendance:teacher_group_attendance' group.id %}" class="btn btn-outline-primary w-100 stretched-link rounded-pill">
                    Take Attendance <i class="bi bi-arrow-right ms-1"></i>
                </a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center py-5">
        <div class="text-muted mb-3"><i class="bi bi-inbox fs-1"></i></div>
        <h5>No groups found.</h5>
    </div>
    {% endfor %}
</div>

<style>
.hover-effect {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.hover-effect:hover {
    transform: translateY(-5px);
    box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
}
.icon-circle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}
</style>
{% endblock %}
